name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL_TESTE: postgresql+psycopg://postgres:ci@127.0.0.1:5432/postgres
      REDIS_URL_TESTE: redis://127.0.0.1:6379/15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt pip-audit
      - name: Auditar dependências
        run: pip-audit -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Testes
        run: pytest -m "not lento"
      - name: Migrações (ida, verificação e volta)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TESTE }}
        run: alembic upgrade head && alembic check && alembic downgrade base

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verificar infraestrutura
        run: bash scripts/verificar_infra.sh

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r backend/requirements-dev.txt
      - name: Testes dos scripts
        run: pytest scripts/testes

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: npm ci && pip install -r ../backend/requirements.txt
      - name: Tipos gerados do OpenAPI em dia
        run: npm run gerar:api && git diff --exit-code -- openapi.json src/api/esquema.d.ts
      - name: Verificação de tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar ambiente efêmero
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "SENHA_REDIS=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "PERMITIR_CADASTRO=true"
            echo "CLAUDE_MODE=off"
          } > infra/.env
          echo "E2E_EMAIL=e2e@exemplo.com" >> "$GITHUB_ENV"
          echo "E2E_SENHA=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Subir API, banco, Redis e frontend (sem GPU)
        run: docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 600 api frontend
      - name: Instalar dependências e navegador
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Testes e2e
        working-directory: frontend
        run: npm run e2e
      - name: Registros dos serviços (em falha)
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200
      - name: Relatório do Playwright (em falha)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-playwright
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
