name: Sincronizar GitHub com as Sprints

# Cria labels, milestones e issues a partir de docs/sprints/ (idempotente).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/sprints/**"
      - "scripts/sincronizar_github.py"
      - ".github/workflows/sincronizar-github.yml"

permissions:
  issues: write
  contents: read

concurrency:
  group: sincronizar-github
  cancel-in-progress: false

jobs:
  sincronizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/sincronizar_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
