version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # faster-whisper 1.1.1 não funciona com huggingface-hub 2.x nem com av 18 ou superior.
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
      - dependency-name: av
        update-types: ["version-update:semver-major"]
      # O kombu do Celery aceita apenas redis abaixo de 6.5.
      - dependency-name: redis
        versions: [">=6.5"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # O runtime é Node 22; @types/node acompanha a major do Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # O openapi-typescript 7 exige typescript 5.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  - package-ecosystem: docker
    directories:
      - /infra/docker
      - /infra/placeholders/render
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
      - dependency-name: nvidia/cuda
        update-types: ["version-update:semver-minor"]
    commit-message:
      prefix: "chore"
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
