version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  - package-ecosystem: docker
    directories:
      - /infra/docker
      - /infra/placeholders/frontend
      - /infra/placeholders/render
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
