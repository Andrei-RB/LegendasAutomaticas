version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # faster-whisper 1.1.1 não funciona com huggingface-hub 2.x nem com av 18 ou superior.
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
      - dependency-name: av
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  - package-ecosystem: docker
    directories:
      - /infra/docker
      - /infra/placeholders/frontend
      - /infra/placeholders/render
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
      - dependency-name: nvidia/cuda
        update-types: ["version-update:semver-minor"]
    commit-message:
      prefix: "chore"
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
