services:
  redis:
    image: redis:7-alpine
    container_name: legenda_redis
    # PROTEÇÃO: Requer autenticação do Redis
    command: redis-server --requirepass ${SENHA_REDIS:-ChaveSegura_2026_OWASP}
    volumes:
      - redis_data:/data
    networks:
      - legenda_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SENHA_REDIS:-ChaveSegura_2026_OWASP}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    container_name: legenda_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_ENV=production
      # URL Segura do Redis com senha
      - REDIS_URL=redis://:${SENHA_REDIS:-ChaveSegura_2026_OWASP}@redis:6379/0
      - UPLOAD_DIR=uploads
      - OUTPUT_DIR=outputs
      - LOG_DIR=logs
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    networks:
      - legenda_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    container_name: legenda_worker
    command: celery -A app.workers.celery_worker worker --loglevel=info --concurrency=1
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://:${SENHA_REDIS:-ChaveSegura_2026_OWASP}@redis:6379/0
      - UPLOAD_DIR=uploads
      - OUTPUT_DIR=outputs
      - LOG_DIR=logs
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    networks:
      - legenda_net
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    restart: unless-stopped

  frontend:
    build: .
    container_name: legenda_frontend
    command: streamlit run frontend/frontend_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - BACKEND_URL=http://api:8000/api/v1
    networks:
      - legenda_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  legenda_net:
    driver: bridge
    name: legenda_net

volumes:
  redis_data:
