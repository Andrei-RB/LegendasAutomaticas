# Resolução pelo DNS do Docker a cada requisição: o nginx sobe mesmo com a API parada.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    set $api_upstream api:8000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    client_max_body_size 1m;

    location = /health {
        include /etc/nginx/snippets/cabecalhos.conf;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    # O proxy repassa o URI original; a API já envia seus próprios cabeçalhos de segurança.
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fluxo SSE: sem buffer nem compressão; o timeout cobre a duração máxima da conexão.
    location ~ ^/api/v1/analises/[^/]+/eventos$ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 5460s;
        proxy_send_timeout 60s;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/cabecalhos.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/cabecalhos.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
